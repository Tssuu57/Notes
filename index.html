<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Notes</title>
  <!-- dev-expert · anti-slop: P5 H5 E5 S5 R5 V4 -->
  <style>
    :root {
      --bg: #ffffff;
      --ink: #1c1c1e;
      --muted: #8e8e93;
      --line: #e5e5ea;
      --fill: #f2f2f7;
      --fill-strong: #e9e9ee;
      --accent: #9b6fd4;
      --danger: #c0392b;
      --shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
      --ease: cubic-bezier(0.32, 0.72, 0, 1);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --ink: #f2f2f7;
        --muted: #98989f;
        --line: #38383a;
        --fill: #1c1c1e;
        --fill-strong: #2c2c2e;
        --accent: #b48ce8;
        --danger: #ff453a;
        --shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    button,
    input { font: inherit; }

    button { color: inherit; }

    a { color: var(--accent); }

    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      will-change: transform;
    }

    #screen-list {
      z-index: 1;
      transform: translateX(0);
    }

    #screen-note {
      z-index: 2;
      transform: translateX(100%);
    }

    .app.view-note #screen-list { transform: translateX(-22%); }

    .app.view-note #screen-note { transform: translateX(0); }

    #screen-list,
    #screen-note {
      transition: transform 360ms var(--ease);
    }

    .scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .wrap {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding-left: clamp(20px, 5vw, 32px);
      padding-right: clamp(20px, 5vw, 32px);
    }

    /* ---------- 目录页 ---------- */
    .list-head {
      padding-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .list-title {
      margin: 0;
      font-size: clamp(1.9rem, 6vw, 2.4rem);
      font-weight: 750;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .icon-button {
      flex: none;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--bg);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 140ms var(--ease), opacity 140ms var(--ease);
    }

    .icon-button:active { transform: scale(0.92); }
    .icon-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .icon-button.is-busy svg { animation: spin 900ms linear infinite; }
    .icon-button svg { width: 20px; height: 20px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 22px 0 8px;
      padding: 0 12px;
      height: 42px;
      border-radius: 11px;
      background: var(--fill);
      color: var(--muted);
    }

    .search-wrap svg { width: 17px; height: 17px; flex: none; }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 0.95rem;
    }

    .search-input::placeholder { color: var(--muted); }

    .note-list {
      margin: 8px 0 0;
      padding: 0 0 120px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 58px;
      padding: 11px 14px;
      border: 0;
      border-radius: 13px;
      background: transparent;
      text-align: left;
      font-size: 1.2rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: background 140ms var(--ease);
    }

    button.row:hover { background: var(--fill); }
    button.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    button.row:active { background: var(--fill-strong); }

    .row.is-active {
      background: var(--fill);
      font-weight: 600;
    }

    .row.is-locating {
      animation: locate-pulse 1.6s var(--ease);
    }

    @keyframes locate-pulse {
      0%, 100% { box-shadow: 0 0 0 0 transparent; background: var(--fill); }
      20%, 60% { box-shadow: 0 0 0 3px var(--accent); background: var(--fill-strong); }
    }

    .chevron {
      flex: none;
      width: 9px;
      height: 9px;
      margin: 0 3px 0 2px;
      border-right: 2px solid var(--muted);
      border-top: 2px solid var(--muted);
      transform: rotate(45deg);
      transition: transform 200ms var(--ease);
    }

    .group.is-open > .row .chevron { transform: rotate(135deg); }

    .chevron-space { flex: none; width: 14px; }

    .row-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row-count {
      flex: none;
      color: var(--muted);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .group-children {
      display: none;
      margin-left: 21px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
    }
    .group.is-open > .group-children { display: block; }

    .list-empty {
      margin: 24px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .status {
      margin: 0;
      padding: 0 0 4px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .status[data-state="error"] { color: var(--danger); }

    /* 目录页底部：固定在视口最底部，文字贴左下、按钮贴右下，内容对齐正文区 */
    .bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 4;
      padding: 20px 0 calc(18px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, var(--bg) 78%, var(--bg) 55%, transparent);
      pointer-events: none;
    }

    .bottom-bar-inner {
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding-left: clamp(20px, 5vw, 32px);
      padding-right: clamp(20px, 5vw, 32px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .bottom-bar .status {
      flex: 1;
      min-width: 0;
    }

    .bottom-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      flex: none;
      pointer-events: auto;
    }

    .bottom-actions .icon-button {
      width: 50px;
      height: 50px;
      border-radius: 16px;
    }

    #locate-btn { color: var(--accent); }

    /* ---------- 笔记页 ---------- */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 10px;
      padding-bottom: 14px;
      background: var(--bg);
    }

    /* 右上角「内容目录」浮层 */
    .outline-panel {
      position: absolute;
      top: 68px;
      right: clamp(20px, 5vw, 32px);
      z-index: 6;
      width: min(320px, calc(100% - 40px));
      max-height: min(62vh, 460px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.98);
      transform-origin: top right;
      transition: opacity 160ms var(--ease), transform 160ms var(--ease), visibility 160ms;
    }

    .outline-panel.is-open {
      opacity: 1;
      visibility: visible;
      transform: none;
    }

    .outline-title {
      padding: 6px 10px 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .outline-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .outline-item {
      display: block;
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      font-size: 0.9rem;
      line-height: 1.4;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .outline-item:hover,
    .outline-item:active { background: var(--fill); }
    .outline-item.is-current { color: var(--accent); background: var(--fill); }
    .outline-item[data-level="3"] { padding-left: 24px; font-size: 0.88rem; }
    .outline-item[data-level="4"] { padding-left: 38px; font-size: 0.86rem; }
    .outline-item[data-level="5"] { padding-left: 52px; font-size: 0.84rem; }
    .outline-item[data-level="6"] { padding-left: 66px; font-size: 0.82rem; }

    .outline-empty {
      margin: 0;
      padding: 10px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .note-content :is(h2, h3, h4, h5, h6) { scroll-margin-top: 76px; }

    .article {
      padding: 6px 0 96px;
    }

    .note-heading {
      margin: 14px 0 30px;
      font-size: clamp(1.9rem, 6.5vw, 2.5rem);
      font-weight: 780;
      letter-spacing: -0.025em;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    /* 加载/提示文本：固定在内容页最底部左下角 */
    .empty-state {
      position: absolute;
      left: clamp(20px, 5vw, 32px);
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      max-width: calc(100% - 2 * clamp(20px, 5vw, 32px));
      color: var(--muted);
      font-size: 1rem;
    }

    .empty-state[data-state="error"] { color: var(--danger); }

    /* 加载省略号：每点 0.5/3s（≈0.167s）累积 . → .. → ...，共 0.5s，再全消失，循环 */
    .loading-dots { display: inline-block; white-space: nowrap; }
    .loading-dots span { opacity: 0; animation: 1s infinite; }
    .loading-dots span:nth-child(1) { animation-name: dot-1; }
    .loading-dots span:nth-child(2) { animation-name: dot-2; }
    .loading-dots span:nth-child(3) { animation-name: dot-3; }

    @keyframes dot-1 {
      0%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dot-2 {
      0%, 16.666% { opacity: 0; }
      16.667%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dot-3 {
      0%, 33.333% { opacity: 0; }
      33.334%, 49.999% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .note-content {
      font-size: 1.12rem;
      line-height: 1.78;
      letter-spacing: 0.002em;
    }

    .note-content > :first-child { margin-top: 0; }

    .note-content h1,
    .note-content h2,
    .note-content h3,
    .note-content h4 {
      margin: 1.9em 0 0.7em;
      font-weight: 750;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .note-content h1 { font-size: 1.7rem; }
    .note-content h2 { font-size: 1.4rem; }
    .note-content h3 { font-size: 1.2rem; }
    .note-content h4 { font-size: 1.08rem; }

    .note-content p,
    .note-content ul,
    .note-content ol { margin: 0 0 1em; }

    .note-content ul,
    .note-content ol { padding-left: 1.7em; }

    .note-content li { margin: 0.25em 0; padding-left: 0.15em; }
    .note-content li::marker { color: var(--muted); }

    .note-content ul ul,
    .note-content ol ul,
    .note-content ul ol,
    .note-content ol ol {
      margin: 0.35em 0 0.35em 0.4em;
      padding-left: 1.3em;
      border-left: 1px solid var(--line);
    }

    .note-content blockquote {
      margin: 1.2em 0;
      padding-left: 1em;
      border-left: 3px solid var(--accent);
    }

    /* 引用块内部不留上下空白：段落贴紧，首尾空行由 JS 去除 */
    .note-content blockquote p { margin: 0; }

    .note-content code,
    .note-content pre {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.9em;
    }

    .note-content code {
      padding: 0.12em 0.38em;
      border-radius: 5px;
      background: var(--fill);
    }

    .note-content pre {
      margin: 0 0 1em;
      padding: 1em;
      border-radius: 10px;
      background: var(--fill);
      overflow-x: auto;
    }

    .note-content pre code { padding: 0; background: transparent; }

    .note-content img {
      max-width: 100%;
      height: auto;
      border-radius: 10px;
    }

    /* 表格：列宽不被压扁，超宽时横向滑动查看（带主题色滑块） */
    .note-content table {
      display: block;
      width: max-content;
      min-width: 100%;
      max-width: 100%;
      margin: 0 0 1em;
      border-collapse: collapse;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--fill);
    }

    .note-content table::-webkit-scrollbar { height: 9px; }
    .note-content table::-webkit-scrollbar-track {
      background: var(--fill);
      border-radius: 6px;
    }
    .note-content table::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 6px;
    }

    .note-content th,
    .note-content td {
      min-width: 6em;
      padding: 0.5em 0.75em;
      border: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    /* 移动端：列宽按内容自适应，单元格文字完整铺开在两行内，表格横向可滑动 */
    @media (max-width: 899px) {
      .note-content table { table-layout: fixed; }
      .note-content th,
      .note-content td {
        min-width: 5em;
        overflow-wrap: anywhere;
      }
      .note-content .cell-clamp {
        display: block;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }
    }

    .note-content hr {
      margin: 2.4em 0;
      border: 0;
      border-top: 1px solid var(--line);
    }

    .note-content .math-inline { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .note-content .math-inline sup,
    .note-content .math-inline sub { font-size: 0.72em; line-height: 0; }
    .note-content .math-frac { display: inline-flex; flex-direction: column; vertical-align: -0.35em; text-align: center; margin: 0 0.12em; }
    .note-content .math-frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.15em 0.05em; }
    .note-content .math-frac > span:last-child { padding: 0.05em 0.15em 0; }
    .note-content .math-sqrt { border-top: 1px solid currentColor; padding: 0 0.1em; }
    .note-content .math-block { display: block; text-align: center; margin: 1.6em 0; }

    /* ---------- 设备适配 ---------- */
    /* 矮屏 / 横屏：收紧顶部与列表间距，避免底栏挤压内容 */
    @media (max-height: 520px) {
      .list-head { padding-top: 8px; }
      .list-title { font-size: clamp(1.5rem, 4vw, 1.9rem); }
      .search-wrap { margin-top: 12px; margin-bottom: 4px; height: 38px; }
      .row { min-height: 48px; padding-top: 8px; padding-bottom: 8px; }
      .note-list { padding-bottom: 96px; }
      .bottom-bar { padding-top: 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
      .bottom-actions .icon-button { width: 44px; height: 44px; }
      .toolbar { padding-top: 6px; padding-bottom: 8px; }
      .note-heading { margin: 8px 0 18px; font-size: clamp(1.5rem, 5vw, 2rem); }
      .outline-panel { top: 56px; max-height: 70vh; }
    }

    /* 窄屏手机：列表行标题略缩，防止长文件名挤压数量标签 */
    @media (max-width: 360px) {
      .row { font-size: 1.08rem; gap: 10px; padding-left: 10px; padding-right: 10px; }
      .row-count { font-size: 0.82rem; }
      .note-content { font-size: 1.05rem; }
    }

    /* 大屏：正文与标题适度放大，阅读更舒适 */
    @media (min-width: 1024px) {
      .note-content { font-size: 1.18rem; line-height: 1.8; }
    }

    /* 桌面：目录与内容可并排显示；内容常驻铺满，目录作为左侧抽屉 */
    @media (min-width: 900px) {
      .app { --sidebar-w: clamp(280px, 26vw, 420px); }

      /* 内容页常驻右侧，默认铺满整屏；宽度随侧栏开合做动画 */
      #screen-note,
      .app.view-note #screen-note {
        z-index: 2;
        transform: translateX(0) !important;
        transition: transform 360ms var(--ease), width 360ms var(--ease);
      }

      /* 目录页默认藏在屏幕左外侧 */
      #screen-list,
      .app.view-note #screen-list {
        z-index: 6;
        width: var(--sidebar-w);
        transform: translateX(-100%) !important;
        box-shadow: none;
      }

      /* 打开侧栏：目录滑入，内容右移让位，两页并排（无阴影，仅细线分隔） */
      .app.sidebar-open #screen-list {
        transform: translateX(0) !important;
        box-shadow: none;
        border-right: 1px solid var(--line);
      }

      .app.sidebar-open #screen-note {
        width: calc(100% - var(--sidebar-w));
        transform: translateX(var(--sidebar-w)) !important;
      }

      /* 桌面端正文撑满内容区宽度（左右仅留少量边距） */
      #screen-note .wrap { max-width: none; }

      /* 桌面端目录抽屉内的内容按抽屉宽度自适应 */
      #screen-list .wrap { max-width: none; }
      #screen-list .bottom-bar-inner { max-width: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <section class="screen" id="screen-list" aria-label="笔记目录">
      <div class="scroll">
        <div class="wrap">
          <header class="list-head">
            <div>
              <p class="brand-label">GitHub Pages Notes</p>
              <h1 class="list-title" id="site-title">Notes</h1>
            </div>
            <button class="icon-button" id="reload-btn" type="button" aria-label="刷新目录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
              </svg>
            </button>
          </header>

          <label class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
            </svg>
            <input class="search-input" id="search-input" type="search" placeholder="搜索笔记" autocomplete="off" aria-label="搜索笔记">
          </label>

          <nav class="note-list" id="note-list" aria-label="笔记列表"></nav>
        </div>
      </div>
      <div class="bottom-bar" id="bottom-bar">
        <div class="bottom-bar-inner">
          <p class="status" id="list-status" role="status" aria-live="polite" data-state="loading">准备读取笔记<span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></p>
          <div class="bottom-actions">
            <button class="icon-button" id="locate-btn" type="button" aria-label="定位到当前文件" title="定位到当前文件" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
              </svg>
            </button>
            <button class="icon-button" id="collapse-all-btn" type="button" aria-label="收起所有文件夹" title="收起所有文件夹">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16M7 12h10M10 18h4"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="screen-note" aria-label="笔记内容">
      <div class="scroll" id="note-scroll">
        <div class="wrap">
          <header class="toolbar">
            <button class="icon-button" id="toc-btn" type="button" aria-label="打开目录" aria-expanded="false" aria-controls="screen-list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.5" y="4.5" width="11" height="15" rx="2.2"/>
                <path d="M17.5 7.2h2.2a1.3 1.3 0 0 1 1.3 1.3v8.9a2.3 2.3 0 0 1-2.3 2.3H9.8"/>
              </svg>
            </button>
            <button class="icon-button" id="outline-btn" type="button" aria-label="查看内容目录" aria-expanded="false" aria-controls="outline-panel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16M4 12h16M4 18h11"/>
              </svg>
            </button>
          </header>

          <div class="outline-panel" id="outline-panel" role="dialog" aria-label="内容目录" aria-modal="false" hidden>
            <p class="outline-title">内容目录</p>
            <nav class="outline-list" id="outline-list" aria-label="标题导航"></nav>
          </div>

          <article class="article">
            <h2 class="note-heading" id="note-heading"></h2>
            <div class="empty-state" id="article-empty" data-state="loading">
              <span id="article-message">正在从 GitHub读取内容<span class="loading-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></span>
            </div>
            <div class="note-content" id="article-content" hidden></div>
          </article>
        </div>
      </div>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const CONFIG = Object.freeze({
        owner: 'Tssuu57',
        repo: 'Notes',
        branch: 'main',
        notesPath: '',
        title: 'Notes'
      });

      const API_ROOT = 'https://api.github.com';
      const RAW_ROOT = 'https://raw.githubusercontent.com';
      const JSON_ACCEPT = 'application/vnd.github+json';
      const HTML_ACCEPT = 'application/vnd.github.html+json';
      const TIMEOUT_MS = 15000;

      const ALLOWED_TAGS = new Set([
        'a', 'article', 'blockquote', 'br', 'code', 'dd', 'del', 'details', 'div',
        'dl', 'dt', 'em', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'hr', 'img', 'input',
        'li', 'ol', 'p', 'pre', 's', 'span', 'strong', 'summary', 'table', 'tbody',
        'td', 'th', 'thead', 'tr', 'ul'
      ]);
      const DENIED_TAGS = new Set(['script', 'style', 'iframe', 'object', 'embed', 'form', 'link', 'meta', 'base', 'svg', 'math']);
      const ALLOWED_ATTRS = {
        a: new Set(['href', 'title']),
        img: new Set(['src', 'alt', 'title', 'width', 'height']),
        code: new Set(['class']),
        pre: new Set(['class', 'lang']),
        input: new Set(['type', 'checked', 'disabled']),
        td: new Set(['align']),
        th: new Set(['align'])
      };

      const elements = {
        app: document.getElementById('app'),
        siteTitle: document.getElementById('site-title'),
        reloadButton: document.getElementById('reload-btn'),
        tocButton: document.getElementById('toc-btn'),
        outlineButton: document.getElementById('outline-btn'),
        outlinePanel: document.getElementById('outline-panel'),
        outlineList: document.getElementById('outline-list'),
        searchInput: document.getElementById('search-input'),
        noteList: document.getElementById('note-list'),
        listStatus: document.getElementById('list-status'),
        collapseAllButton: document.getElementById('collapse-all-btn'),
        locateButton: document.getElementById('locate-btn'),
        noteScroll: document.getElementById('note-scroll'),
        noteHeading: document.getElementById('note-heading'),
        articleContent: document.getElementById('article-content'),
        articleEmpty: document.getElementById('article-empty'),
        articleMessage: document.getElementById('article-message')
      };

      const state = {
        config: null,
        notes: [],
        tree: null,
        selectedPath: '',
        searchTerm: '',
        currentNotePath: '',
        expanded: new Set(),
        view: 'list'
      };

      function cleanOwnerOrRepo(value) {
        const text = String(value || '').trim();
        return /^[A-Za-z0-9_.-]{1,100}$/.test(text) ? text : '';
      }

      function normalizePath(rawValue) {
        const text = String(rawValue || '').replace(/\\/g, '/').replace(/^\/+|\/+$/g, '');
        if (!text) {
          return '';
        }
        const parts = text.split('/').filter((part) => part.length > 0);
        if (parts.some((part) => part === '.' || part === '..' || part.length > 200)) {
          throw new Error('路径包含无效片段');
        }
        return parts.join('/');
      }

      function normalizeRef(rawValue) {
        const text = String(rawValue || '').trim();
        if (!text) {
          return '';
        }
        if (text.length > 120 || text.includes('\\') || text.startsWith('/') || text.endsWith('/')) {
          throw new Error('分支名称不合法');
        }
        return text;
      }

      function hashPath() {
        try {
          const hash = decodeURIComponent(window.location.hash.replace(/^#/, ''));
          if (hash.startsWith('note/')) {
            return normalizePath(hash.slice(5));
          }
        } catch (error) {
          return '';
        }
        return '';
      }

      function resolveConfig() {
        const params = new URLSearchParams(window.location.search);
        const hostname = window.location.hostname.toLowerCase();
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        let owner = cleanOwnerOrRepo(params.get('owner')) || CONFIG.owner;
        let repo = cleanOwnerOrRepo(params.get('repo')) || CONFIG.repo;

        if (!owner || !repo) {
          const match = hostname.match(/^([a-z0-9-]+)\.github\.io$/i);
          if (match) {
            owner = owner || match[1];
            const projectRepo = pathParts[0] && pathParts[0] !== match[1] ? pathParts[0] : '';
            repo = repo || projectRepo || match[1] + '.github.io';
          }
        }

        if (!owner || !repo) {
          throw new Error('未识别到仓库。请在网址中加入 ?owner=用户名&repo=仓库名，或把仓库命名为 用户名.github.io');
        }

        const branch = normalizeRef(params.has('branch') ? params.get('branch') : CONFIG.branch);
        const notesPathRaw = params.has('path') ? params.get('path') : CONFIG.notesPath;
        const selectedPath = normalizePath(params.get('note') || hashPath());
        const title = String(params.get('title') || CONFIG.title || repo).slice(0, 80);

        return {
          owner,
          repo,
          branch,
          notesPath: normalizePath(notesPathRaw),
          selectedPath,
          title
        };
      }

      function contentApiUrl(config, path) {
        const encodedPath = path ? '/' + path.split('/').map(encodeURIComponent).join('/') : '';
        const base = API_ROOT + '/repos/' + encodeURIComponent(config.owner) + '/' + encodeURIComponent(config.repo) + '/contents' + encodedPath;
        const query = config.branch ? '?ref=' + encodeURIComponent(config.branch) : '';
        return base + query;
      }

      function treeApiUrl(config) {
        const ref = config.branch || 'HEAD';
        const base = API_ROOT + '/repos/' + encodeURIComponent(config.owner) + '/' + encodeURIComponent(config.repo) + '/git/trees/' + encodeURIComponent(ref);
        return base + '?recursive=1';
      }

      function describeHttpError(response) {
        if (response.status === 404) {
          return '没有找到仓库、分支或笔记目录。请检查 owner、repo、branch 和 path 配置';
        }
        if (response.status === 403) {
          const remaining = response.headers.get('x-ratelimit-remaining');
          if (remaining === '0') {
            return 'GitHub 匿名接口额度已用完（每小时 60 次）。请稍后重试，或为页面接入自有代理';
          }
          return 'GitHub 接口拒绝了本次请求，请稍后重试';
        }
        return 'GitHub 接口返回 ' + response.status + '，请稍后重试';
      }

      async function fetchFromGithub(url, accept) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), TIMEOUT_MS);
        try {
          const response = await fetch(url, {
            headers: {
              Accept: accept,
              'X-GitHub-Api-Version': '2022-11-28'
            },
            signal: controller.signal
          });
          if (!response.ok) {
            throw new Error(describeHttpError(response));
          }
          return await response.text();
        } catch (error) {
          if (error && error.name === 'AbortError') {
            throw new Error('请求超时，请检查网络后重试');
          }
          throw error;
        } finally {
          window.clearTimeout(timer);
        }
      }

      function setButtonBusy(isBusy) {
        elements.reloadButton.classList.toggle('is-busy', isBusy);
        elements.reloadButton.setAttribute('aria-busy', String(isBusy));
      }

      function setListStatus(kind, message) {
        elements.listStatus.dataset.state = kind;
        elements.listStatus.textContent = message;
        if (kind === 'loading') {
          elements.listStatus.append(makeLoadingDots());
        }
      }

      // 生成内容页同款的省略号加载动画（三点累积循环）
      function makeLoadingDots() {
        const dots = document.createElement('span');
        dots.className = 'loading-dots';
        dots.setAttribute('aria-hidden', 'true');
        for (let i = 0; i < 3; i += 1) {
          const dot = document.createElement('span');
          dot.textContent = '.';
          dots.append(dot);
        }
        return dots;
      }

      function showArticle(kind, message) {
        elements.articleContent.hidden = true;
        elements.articleEmpty.hidden = false;
        elements.articleEmpty.dataset.state = kind;
        elements.articleMessage.textContent = message;
        if (kind === 'loading') {
          elements.articleMessage.append(makeLoadingDots());
        }
        closeOutline();
      }

      // ---------- 内容目录（H2~H6，忽略 H1） ----------
      const OUTLINE_SELECTOR = 'h2, h3, h4, h5, h6';

      function closeOutline() {
        elements.outlinePanel.classList.remove('is-open');
        elements.outlineButton.setAttribute('aria-expanded', 'false');
      }

      function toggleOutline() {
        const willOpen = !elements.outlinePanel.classList.contains('is-open');
        if (willOpen) {
          buildOutline();
          elements.outlinePanel.hidden = false;
          elements.outlinePanel.classList.add('is-open');
          elements.outlineButton.setAttribute('aria-expanded', 'true');
        } else {
          closeOutline();
        }
      }

      function headingText(node) {
        // 取标题纯文本（含数学 span 的可读文本），去掉多余空白
        return (node.textContent || '').replace(/\s+/g, ' ').trim();
      }

      function buildOutline() {
        const list = elements.outlineList;
        list.replaceChildren();

        if (elements.articleContent.hidden) {
          const empty = document.createElement('p');
          empty.className = 'outline-empty';
          empty.textContent = '当前笔记没有可显示的标题';
          list.append(empty);
          return;
        }

        const headings = Array.from(elements.articleContent.querySelectorAll(OUTLINE_SELECTOR));
        headings.forEach((heading, index) => {
          const id = 'outline-target-' + index;
          heading.id = id;
          const text = headingText(heading) || '（无标题）';
          const level = Number(heading.tagName.slice(1));

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'outline-item';
          btn.dataset.level = String(level);
          btn.dataset.target = id;
          btn.textContent = text;
          btn.title = text;
          list.append(btn);
        });

        if (!headings.length) {
          const empty = document.createElement('p');
          empty.className = 'outline-empty';
          empty.textContent = '当前笔记没有二级及以下标题';
          list.append(empty);
        }
      }

      function jumpToHeading(targetId) {
        const target = document.getElementById(targetId);
        if (!target) {
          return;
        }
        closeOutline();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        elements.outlineList.querySelectorAll('.outline-item').forEach((item) => {
          item.classList.toggle('is-current', item.dataset.target === targetId);
        });
      }

      function titleFromPath(path) {
        const name = path.split('/').pop() || path;
        return name.replace(/\.(md|markdown)$/i, '').replace(/[-_]/g, ' ');
      }

      function updateHash(path) {
        const url = new URL(window.location.href);
        url.hash = path ? 'note/' + encodeURIComponent(path) : '';
        window.history.replaceState(null, '', url.toString());
      }

      function switchView(view) {
        state.view = view;
        elements.app.classList.toggle('view-note', view === 'note');
        if (view === 'list') {
          closeOutline();
          document.title = state.config ? state.config.title : 'Notes';
        }
      }

      function isDesktopLayout() {
        return window.matchMedia('(min-width: 900px)').matches;
      }

      // 桌面端目录抽屉开合；移动端保持互斥视图切换
      function setSidebar(open) {
        const isOpen = !!open;
        elements.app.classList.toggle('sidebar-open', isOpen);
        elements.tocButton.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        elements.tocButton.setAttribute('aria-label', isOpen ? '关闭目录' : '打开目录');
      }

      function toggleSidebar() {
        setSidebar(!elements.app.classList.contains('sidebar-open'));
      }

      function makeRow({ label, active, count, chevron, path, folder }) {
        const row = document.createElement('button');
        row.type = 'button';
        row.className = 'row' + (active ? ' is-active' : '');
        if (folder !== undefined) {
          row.dataset.folder = folder;
          row.setAttribute('aria-expanded', 'false');
        } else {
          row.dataset.path = path;
          row.title = path;
          if (active) {
            row.setAttribute('aria-current', 'true');
          }
        }
        const mark = document.createElement('span');
        mark.className = chevron ? 'chevron' : 'chevron-space';
        mark.setAttribute('aria-hidden', 'true');
        const text = document.createElement('span');
        text.className = 'row-label';
        text.textContent = label;
        row.append(mark, text);
        if (count !== undefined) {
          const badge = document.createElement('span');
          badge.className = 'row-count';
          badge.textContent = String(count);
          row.append(badge);
        }
        return row;
      }

      function buildTree(notes) {
        const root = { folders: new Map(), files: [] };
        for (const note of notes) {
          const parts = note.path.split('/');
          let cursor = root;
          for (let i = 0; i < parts.length - 1; i += 1) {
            const name = parts[i];
            if (!cursor.folders.has(name)) {
              cursor.folders.set(name, { folders: new Map(), files: [] });
            }
            cursor = cursor.folders.get(name);
          }
          cursor.files.push(note);
        }
        return root;
      }

      function collectNotes(node) {
        let total = node.files.length;
        for (const child of node.folders.values()) {
          total += collectNotes(child);
        }
        return total;
      }

      function renderFolderNode(node, name, path, term, searching) {
        const descendants = collectNotes(node);
        const matches = (item) => {
          return !term || item.path.toLocaleLowerCase().includes(term) || item.name.toLocaleLowerCase().includes(term);
        };
        if (searching) {
          const anyMatch = (current) => {
            if (current.files.some(matches)) {
              return true;
            }
            for (const child of current.folders.values()) {
              if (anyMatch(child) || (term && name.toLocaleLowerCase().includes(term))) {
                return true;
              }
            }
            return false;
          };
          if (!anyMatch(node) && !(term && name.toLocaleLowerCase().includes(term))) {
            return null;
          }
        }

        const open = searching || state.expanded.has(path);
        const group = document.createElement('div');
        group.className = 'group' + (open ? ' is-open' : '');
        const row = makeRow({ label: name, chevron: true, count: descendants, folder: path });
        row.setAttribute('aria-expanded', String(open));
        const children = document.createElement('div');
        children.className = 'group-children';

        const subNames = Array.from(node.folders.keys()).sort((a, b) => a.localeCompare(b, 'zh-CN'));
        for (const subName of subNames) {
          const subPath = path ? path + '/' + subName : subName;
          const rendered = renderFolderNode(node.folders.get(subName), subName, subPath, term, searching);
          if (rendered) {
            children.append(rendered);
          }
        }
        const sortedFiles = node.files.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
        for (const note of sortedFiles) {
          if (matches(note) || (term && name.toLocaleLowerCase().includes(term))) {
            children.append(makeRow({
              label: titleFromPath(note.path),
              path: note.path,
              active: note.path === state.selectedPath
            }));
          }
        }
        group.append(row, children);
        return group;
      }

      function renderList() {
        const term = state.searchTerm.trim().toLocaleLowerCase();
        const searching = term.length > 0;
        const tree = buildTree(state.notes);

        elements.noteList.replaceChildren();
        const fragment = document.createDocumentFragment();

        const rootNames = Array.from(tree.folders.keys()).sort((a, b) => a.localeCompare(b, 'zh-CN'));
        for (const name of rootNames) {
          const rendered = renderFolderNode(tree.folders.get(name), name, name, term, searching);
          if (rendered) {
            fragment.append(rendered);
          }
        }
        const sortedFiles = tree.files.slice().sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));
        for (const note of sortedFiles) {
          if (!term || note.path.toLocaleLowerCase().includes(term) || note.name.toLocaleLowerCase().includes(term)) {
            fragment.append(makeRow({
              label: titleFromPath(note.path),
              path: note.path,
              active: note.path === state.selectedPath
            }));
          }
        }

        if (fragment.childNodes.length === 0) {
          const empty = document.createElement('p');
          empty.className = 'list-empty';
          empty.textContent = state.notes.length === 0 ? '这个目录里还没有 Markdown 笔记' : '没有匹配的笔记';
          fragment.append(empty);
        }

        elements.noteList.append(fragment);
        updateLocateBar();
        updateCollapseAllButton();
      }

      function currentNotePath() {
        return state.selectedPath || state.currentNotePath || '';
      }

      // 目录页底部「定位到当前文件」按钮：仅当当前文件确实在列表里时出现
      function updateLocateBar() {
        const path = currentNotePath();
        const exists = path && state.notes.some((note) => note.path === path);
        elements.locateButton.hidden = !exists;
      }

      // 目录页底部「收起所有文件夹」按钮：仅当存在文件夹时出现
      function updateCollapseAllButton() {
        const tree = buildTree(state.notes);
        elements.collapseAllButton.hidden = tree.folders.size === 0;
      }

      function collapseAllFolders() {
        if (state.expanded.size === 0) {
          return;
        }
        state.expanded.clear();
        renderList();
        elements.noteList.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function locateCurrentNote() {
        const path = currentNotePath();
        if (!path || !state.notes.some((note) => note.path === path)) {
          return;
        }

        // 清除搜索以保证目标可见
        if (state.searchTerm) {
          state.searchTerm = '';
          elements.searchInput.value = '';
        }

        // 展开目标文件所在的各级文件夹
        const segments = path.split('/');
        if (segments.length > 1) {
          let prefix = '';
          for (let i = 0; i < segments.length - 1; i += 1) {
            prefix = prefix ? prefix + '/' + segments[i] : segments[i];
            state.expanded.add(prefix);
          }
        }

        renderList();

        // 滚动到目标行并高亮
        const target = elements.noteList.querySelector('button[data-path="' + CSS.escape(path) + '"]');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('is-locating');
          window.setTimeout(() => target.classList.remove('is-locating'), 1600);
        }
      }

      function resolveRelativePath(basePath, rawHref) {
        const cleanHref = String(rawHref || '').split(/[?#]/)[0];
        const baseDir = basePath.split('/').slice(0, -1).join('/');
        const segments = [baseDir, cleanHref].filter(Boolean).join('/').split('/');
        const resolved = [];
        for (const segment of segments) {
          if (!segment || segment === '.') {
            continue;
          }
          if (segment === '..') {
            if (resolved.length === 0) {
              return '';
            }
            resolved.pop();
            continue;
          }
          resolved.push(segment);
        }
        return resolved.join('/');
      }

      function safeUrl(rawValue, tagName, config, basePath) {
        const value = String(rawValue || '').trim();
        if (!value || value.startsWith('//')) {
          return null;
        }
        if (/^#/.test(value)) {
          return value;
        }
        if (/^(https?:|mailto:)/i.test(value)) {
          return value;
        }
        if (/^[a-z][a-z0-9+.-]*:/i.test(value)) {
          return null;
        }

        const resolvedPath = resolveRelativePath(basePath, value);
        if (!resolvedPath) {
          return null;
        }
        if (tagName === 'a' && /\.(md|markdown)$/i.test(resolvedPath)) {
          return '#note/' + encodeURIComponent(resolvedPath);
        }
        return RAW_ROOT + '/' + encodeURIComponent(config.owner) + '/' + encodeURIComponent(config.repo) + '/HEAD/' + resolvedPath.split('/').map(encodeURIComponent).join('/');
      }

      const MATH_SYMBOLS = Object.freeze({
        'alpha': 'α', 'beta': 'β', 'gamma': 'γ', 'delta': 'δ', 'epsilon': 'ε',
        'varepsilon': 'ε', 'zeta': 'ζ', 'eta': 'η', 'theta': 'θ', 'iota': 'ι',
        'kappa': 'κ', 'lambda': 'λ', 'mu': 'μ', 'nu': 'ν', 'xi': 'ξ',
        'pi': 'π', 'rho': 'ρ', 'sigma': 'σ', 'tau': 'τ', 'upsilon': 'υ',
        'phi': 'φ', 'varphi': 'φ', 'chi': 'χ', 'psi': 'ψ', 'omega': 'ω',
        'Gamma': 'Γ', 'Delta': 'Δ', 'Theta': 'Θ', 'Lambda': 'Λ', 'Xi': 'Ξ',
        'Pi': 'Π', 'Sigma': 'Σ', 'Phi': 'Φ', 'Psi': 'Ψ', 'Omega': 'Ω',
        'times': '×', 'div': '÷', 'cdot': '·', 'ast': '∗', 'pm': '±', 'mp': '∓',
        'le': '≤', 'leq': '≤', 'ge': '≥', 'geq': '≥', 'ne': '≠', 'neq': '≠',
        'approx': '≈', 'sim': '∼', 'equiv': '≡', 'propto': '∝',
        'to': '→', 'rightarrow': '→', 'leftarrow': '←', 'Leftrightarrow': '⇔',
        'Rightarrow': '⇒', 'Leftarrow': '⇐', 'leftrightarrow': '↔',
        'in': '∈', 'notin': '∉', 'ni': '∋', 'subset': '⊂', 'supset': '⊃',
        'subseteq': '⊆', 'supseteq': '⊇', 'cup': '∪', 'cap': '∩',
        'emptyset': '∅', 'varnothing': '∅', 'forall': '∀', 'exists': '∃',
        'neg': '¬', 'land': '∧', 'lor': '∨', 'sum': '∑', 'prod': '∏',
        'int': '∫', 'infty': '∞', 'partial': '∂', 'nabla': '∇',
        'sqrt': '√', 'angle': '∠', 'perp': '⊥', 'parallel': '∥',
        'bullet': '•', 'ldots': '…', 'cdots': '⋯', 'quad': ' ', 'qquad': ' '
      });

      function decodeNumericEntities(text) {
        return text.replace(/&#(x[0-9a-f]+|\d+);?/gi, (whole, body) => {
          const hex = /^x/i.test(body);
          const value = hex ? parseInt(body.slice(1), 16) : parseInt(body, 10);
          if (!Number.isFinite(value) || value < 0 || value > 0x10ffff) {
            return whole;
          }
          if (value >= 0xd800 && value <= 0xdfff) {
            return whole;
          }
          try {
            return String.fromCodePoint(value);
          } catch (error) {
            return whole;
          }
        });
      }

      function mathFragment(source) {
        const fragment = document.createDocumentFragment();
        const text = String(source || '').trim();
        let index = 0;

        const readArg = () => {
          while (index < text.length && /\s/.test(text[index])) {
            index += 1;
          }
          if (text[index] !== '{') {
            return text[index++] || '';
          }
          index += 1;
          let depth = 1;
          const start = index;
          while (index < text.length && depth > 0) {
            if (text[index] === '{') {
              depth += 1;
            } else if (text[index] === '}') {
              depth -= 1;
              if (depth === 0) {
                break;
              }
            }
            index += 1;
          }
          const value = text.slice(start, index);
          if (text[index] === '}') {
            index += 1;
          }
          return value;
        };

        const readCommand = () => {
          index += 1;
          const start = index;
          while (index < text.length && /[a-zA-Z]/.test(text[index])) {
            index += 1;
          }
          return text.slice(start, index);
        };

        const readBase = () => {
          if (index >= text.length) {
            return null;
          }
          const char = text[index];
          if (char === '^' || char === '_') {
            return null;
          }
          if (char === '{') {
            index += 1;
            let depth = 1;
            const start = index;
            while (index < text.length && depth > 0) {
              if (text[index] === '{') {
                depth += 1;
              } else if (text[index] === '}') {
                depth -= 1;
                if (depth === 0) {
                  break;
                }
              }
              index += 1;
            }
            const inner = text.slice(start, index);
            if (text[index] === '}') {
              index += 1;
            }
            const span = document.createElement('span');
            span.append(mathFragment(inner));
            return span;
          }
          if (char === '\\') {
            const command = readCommand();
            if (command === 'frac' || command === 'dfrac' || command === 'tfrac') {
              const numerator = readArg();
              const denominator = readArg();
              const frac = document.createElement('span');
              frac.className = 'math-frac';
              const top = document.createElement('span');
              top.append(mathFragment(numerator));
              const bottom = document.createElement('span');
              bottom.append(mathFragment(denominator));
              frac.append(top, bottom);
              return frac;
            }
            if (command === 'sqrt') {
              const radicand = readArg();
              const root = document.createElement('span');
              root.className = 'math-sqrt';
              root.append(document.createTextNode('√'), mathFragment(radicand));
              return root;
            }
            if (command === 'text' || command === 'mathrm' || command === 'operatorname') {
              const literal = readArg();
              const span = document.createElement('span');
              span.textContent = literal;
              return span;
            }
            return document.createTextNode(MATH_SYMBOLS[command] !== undefined ? MATH_SYMBOLS[command] : command);
          }
          index += 1;
          return document.createTextNode(char);
        };

        while (index < text.length) {
          if (/\s/.test(text[index])) {
            index += 1;
            continue;
          }
          const base = readBase();
          let superscript = null;
          let subscript = null;
          for (let step = 0; step < 2; step += 1) {
            const marker = text[index];
            if (marker === '^' || marker === '_') {
              index += 1;
              const content = readArg();
              const script = document.createElement(marker === '^' ? 'sup' : 'sub');
              script.append(mathFragment(content));
              if (marker === '^') {
                superscript = script;
              } else {
                subscript = script;
              }
            }
          }
          if (superscript || subscript) {
            const group = document.createElement('span');
            if (base) {
              group.append(base);
            }
            if (superscript) {
              group.append(superscript);
            }
            if (subscript) {
              group.append(subscript);
            }
            fragment.append(group);
          } else if (base) {
            fragment.append(base);
          }
        }
        return fragment;
      }

      function appendTextWithBreaks(fragment, text, preserveBreaks) {
        if (!preserveBreaks || !text.includes('\n')) {
          if (text) {
            fragment.append(document.createTextNode(text));
          }
          return;
        }
        const lines = text.split('\n');
        lines.forEach((line, index) => {
          if (index > 0) {
            fragment.append(document.createElement('br'));
          }
          if (line) {
            fragment.append(document.createTextNode(line));
          }
        });
      }

      function renderMathInText(text, preserveBreaks) {
        const fragment = document.createDocumentFragment();
        const pattern = /(\$\$[\s\S]+?\$\$|\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$)/g;
        let cursor = 0;
        let match;
        while ((match = pattern.exec(text)) !== null) {
          if (match.index > cursor) {
            appendTextWithBreaks(fragment, text.slice(cursor, match.index), preserveBreaks);
          }
          const token = match[0];
          const block = token.startsWith('$$');
          const source = block ? token.slice(2, -2) : token.slice(1, -1);
          const wrap = document.createElement('span');
          wrap.className = block ? 'math-block' : 'math-inline';
          wrap.append(mathFragment(source));
          fragment.append(wrap);
          cursor = match.index + token.length;
        }
        if (cursor < text.length) {
          appendTextWithBreaks(fragment, text.slice(cursor), preserveBreaks);
        }
        return fragment;
      }

      function textNodesWithMarkup(text, preserveBreaks) {
        return renderMathInText(decodeNumericEntities(text), preserveBreaks);
      }

      function cleanNode(node, config, basePath, preserveBreaks) {
        if (node.nodeType === Node.TEXT_NODE) {
          return textNodesWithMarkup(node.nodeValue || '', preserveBreaks);
        }
        if (node.nodeType !== Node.ELEMENT_NODE) {
          return document.createTextNode('');
        }

        const tagName = node.tagName.toLowerCase();
        if (DENIED_TAGS.has(tagName)) {
          return document.createTextNode('');
        }

        const childPreserveBreaks = preserveBreaks || tagName === 'blockquote';
        const children = document.createDocumentFragment();
        for (const child of Array.from(node.childNodes)) {
          children.append(cleanNode(child, config, basePath, childPreserveBreaks));
        }

        if (!ALLOWED_TAGS.has(tagName)) {
          return children;
        }

        const clean = document.createElement(tagName);
        const allowedAttrs = ALLOWED_ATTRS[tagName] || new Set();
        for (const attr of Array.from(node.attributes)) {
          if (!allowedAttrs.has(attr.name.toLowerCase())) {
            continue;
          }
          if (tagName === 'input' && (attr.name === 'type' ? attr.value !== 'checkbox' : false)) {
            continue;
          }
          if (tagName === 'img' && (attr.name === 'width' || attr.name === 'height') && !/^\d{1,4}$/.test(attr.value)) {
            continue;
          }
          clean.setAttribute(attr.name, attr.value);
        }

        if (tagName === 'a') {
          const safeHref = safeUrl(node.getAttribute('href'), 'a', config, basePath);
          if (safeHref) {
            clean.setAttribute('href', safeHref);
            if (/^https?:/i.test(safeHref)) {
              clean.setAttribute('rel', 'noopener noreferrer');
            }
          } else {
            clean.removeAttribute('href');
          }
        }

        if (tagName === 'img') {
          const safeSrc = safeUrl(node.getAttribute('src'), 'img', config, basePath);
          if (safeSrc) {
            clean.setAttribute('src', safeSrc);
          } else {
            clean.removeAttribute('src');
          }
        }

        if (tagName === 'blockquote') {
          // 去掉引用块首尾多余的空行（<br>），避免上下出现空白
          while (children.firstChild && children.firstChild.nodeType === Node.ELEMENT_NODE && children.firstChild.tagName === 'BR') {
            children.removeChild(children.firstChild);
          }
          while (children.lastChild && children.lastChild.nodeType === Node.ELEMENT_NODE && children.lastChild.tagName === 'BR') {
            children.removeChild(children.lastChild);
          }
        }

        // 表格单元格内容包一层，便于移动端限制为两行并横向铺开
        if (tagName === 'td' || tagName === 'th') {
          const clamp = document.createElement('span');
          clamp.className = 'cell-clamp';
          clamp.append(children);
          clean.append(clamp);
        } else {
          clean.append(children);
        }
        return clean;
      }

      function sanitizeRenderedHtml(rawHtml, config, basePath) {
        const parsed = new DOMParser().parseFromString(rawHtml, 'text/html');
        const source = parsed.getElementById('file') || parsed.body;
        const fragment = document.createDocumentFragment();
        for (const child of Array.from(source.childNodes)) {
          fragment.append(cleanNode(child, config, basePath));
        }
        return fragment;
      }

      // 移动端：按每列最长内容计算列宽，让所有文字完整铺开在两行内（不省略、不缩字号）
      function fitTableCells(root) {
        if (!root) return;
        const tables = Array.from(root.querySelectorAll('table'));
        const mobile = window.matchMedia('(max-width: 899px)').matches;

        // 先复位，保证跨断点或重复渲染时从干净状态重算
        tables.forEach(function (table) {
          table.querySelectorAll('th, td').forEach(function (cell) {
            cell.style.width = '';
            cell.style.minWidth = '';
            cell.style.maxWidth = '';
          });
          table.querySelectorAll('.cell-clamp').forEach(function (clamp) {
            clamp.style.width = '';
            clamp.style.whiteSpace = '';
          });
        });
        if (!mobile) return;

        tables.forEach(function (table) {
          const rows = Array.from(table.querySelectorAll('tr'));
          if (!rows.length) return;
          const cellsOf = function (row) { return row.querySelectorAll('th, td'); };
          let colCount = 0;
          rows.forEach(function (row) { colCount = Math.max(colCount, cellsOf(row).length); });

          for (let col = 0; col < colCount; col += 1) {
            // 测出该列最长的一段文字单行铺开所需的宽度
            let maxSingle = 0;
            rows.forEach(function (row) {
              const cell = cellsOf(row)[col];
              if (!cell) return;
              const clamp = cell.querySelector('.cell-clamp') || cell;
              const prevWhite = clamp.style.whiteSpace;
              const prevWidth = clamp.style.width;
              clamp.style.whiteSpace = 'nowrap';
              clamp.style.width = 'max-content';
              maxSingle = Math.max(maxSingle, clamp.scrollWidth || clamp.getBoundingClientRect().width);
              clamp.style.whiteSpace = prevWhite;
              clamp.style.width = prevWidth;
            });
            // 列宽 = 最长单行的一半 + 单元格内边距/边框 + 余量，确保扣掉内边距后仍能两行铺开
            let pad = 0;
            for (let r = 0; r < rows.length && !pad; r += 1) {
              const c = cellsOf(rows[r])[col];
              if (c) {
                const ccs = getComputedStyle(c);
                pad = parseFloat(ccs.paddingLeft) + parseFloat(ccs.paddingRight)
                    + parseFloat(ccs.borderLeftWidth) + parseFloat(ccs.borderRightWidth);
              }
            }
            const width = Math.max(80, Math.ceil(maxSingle / 2) + Math.round(pad) + 16);
            rows.forEach(function (row) {
              const cell = cellsOf(row)[col];
              if (!cell) return;
              cell.style.width = width + 'px';
              cell.style.minWidth = width + 'px';
              cell.style.maxWidth = width + 'px';
            });
          }
        });
      }

      async function loadNote(path) {
        let normalized;
        try {
          normalized = normalizePath(path);
        } catch (error) {
          showArticle('error', error.message);
          return;
        }

        state.selectedPath = normalized;
        state.currentNotePath = normalized;
        updateHash(normalized);
        renderList();
        elements.noteHeading.textContent = titleFromPath(normalized);
        showArticle('loading', '正在从 GitHub读取内容');
        elements.noteScroll.scrollTop = 0;

        try {
          const rawHtml = await fetchFromGithub(contentApiUrl(state.config, normalized), HTML_ACCEPT);
          const cleanContent = sanitizeRenderedHtml(rawHtml, state.config, normalized);
          elements.articleContent.replaceChildren(cleanContent);
          elements.articleContent.hidden = false;
          elements.articleEmpty.hidden = true;
          fitTableCells(elements.articleContent);
          document.title = titleFromPath(normalized) + ' · ' + state.config.title;
          setListStatus('success', '已打开：' + titleFromPath(normalized));
        } catch (error) {
          showArticle('error', error.message || '未知错误');
          setListStatus('error', error.message || '未知错误');
        }
      }

      function openNote(path) {
        switchView('note');
        void loadNote(path);
      }

      function showList() {
        if (isDesktopLayout()) {
          // 桌面端：切回目录时把抽屉滑出，内容页让位
          switchView('list');
          setSidebar(true);
          updateHash('');
          state.currentNotePath = '';
        } else {
          switchView('list');
          updateHash('');
          state.currentNotePath = '';
        }
      }

      async function loadNotes() {
        setButtonBusy(true);
        setListStatus('loading', '正在读取笔记目录');

        try {
          const rawJson = await fetchFromGithub(treeApiUrl(state.config), JSON_ACCEPT);
          const payload = JSON.parse(rawJson);
          const entries = Array.isArray(payload.tree) ? payload.tree : [];
          const base = state.config.notesPath ? state.config.notesPath + '/' : '';

          const files = [];
          for (const entry of entries) {
            if (!entry || typeof entry.path !== 'string') {
              continue;
            }
            if (base && entry.path.indexOf(base) !== 0) {
              continue;
            }
            const relative = base ? entry.path.slice(base.length) : entry.path;
            if (!relative) {
              continue;
            }
            if (entry.type === 'blob' && /\.(md|markdown)$/i.test(relative)) {
              const fileName = relative.split('/').pop() || relative;
              // 忽略 README（不区分大小写，含各级子目录中的 README）
              if (/^readme\.(md|markdown)$/i.test(fileName)) {
                continue;
              }
              files.push({
                name: fileName,
                path: normalizePath(entry.path)
              });
            }
          }

          state.notes = files.sort((left, right) => left.name.localeCompare(right.name, 'zh-CN'));
          // 默认所有文件夹收起
          state.expanded.clear();

          renderList();
          if (state.notes.length === 0) {
            setListStatus('empty', '没有找到 Markdown 笔记。请把 .md 文件放进笔记目录');
            return;
          }

          setListStatus('success', '已读取 ' + state.notes.length + ' 篇笔记');
          const preferred = state.selectedPath && state.notes.some((note) => note.path === state.selectedPath)
            ? state.selectedPath
            : '';
          if (preferred) {
            await loadNote(preferred);
          }
        } catch (error) {
          state.notes = [];
          renderList();
          setListStatus('error', error.message || '读取目录失败');
        } finally {
          setButtonBusy(false);
        }
      }

      function init() {
        try {
          state.config = resolveConfig();
        } catch (error) {
          setListStatus('error', error.message);
          elements.siteTitle.textContent = '无法识别仓库';
          return;
        }

        elements.siteTitle.textContent = state.config.title;
        void loadNotes().then(() => {
          if (state.config.selectedPath && state.notes.some((note) => note.path === state.config.selectedPath)) {
            openNote(state.config.selectedPath);
          } else if (isDesktopLayout()) {
            // 桌面端首屏无深链：展开目录抽屉，内容区提示选择笔记
            setSidebar(true);
            elements.articleEmpty.dataset.state = 'empty';
            elements.articleMessage.textContent = '从左侧目录选择一篇笔记开始阅读';
          }
        });
      }

      elements.reloadButton.addEventListener('click', () => void loadNotes());
      elements.tocButton.addEventListener('click', () => {
        if (isDesktopLayout()) {
          toggleSidebar();
        } else {
          showList();
        }
      });
      elements.locateButton.addEventListener('click', locateCurrentNote);
      elements.collapseAllButton.addEventListener('click', collapseAllFolders);
      elements.outlineButton.addEventListener('click', (event) => {
        event.stopPropagation();
        toggleOutline();
      });
      elements.outlinePanel.addEventListener('click', (event) => {
        const item = event.target.closest('button[data-target]');
        if (item) {
          jumpToHeading(item.dataset.target);
        }
      });
      document.addEventListener('click', (event) => {
        if (!elements.outlinePanel.classList.contains('is-open')) {
          return;
        }
        if (event.target.closest('#outline-panel') || event.target.closest('#outline-btn')) {
          return;
        }
        closeOutline();
      });
      elements.searchInput.addEventListener('input', (event) => {
        state.searchTerm = event.target.value || '';
        renderList();
      });
      elements.noteList.addEventListener('click', (event) => {
        const folderRow = event.target.closest('button[data-folder]');
        if (folderRow) {
          const path = folderRow.dataset.folder;
          if (state.expanded.has(path)) {
            state.expanded.delete(path);
          } else {
            state.expanded.add(path);
          }
          renderList();
          return;
        }
        const noteRow = event.target.closest('button[data-path]');
        if (noteRow) {
          openNote(noteRow.dataset.path);
        }
      });
      window.addEventListener('hashchange', () => {
        const path = hashPath();
        if (path && path !== state.currentNotePath) {
          openNote(path);
        } else if (!path && state.view === 'note') {
          showList();
        }
      });

      // 跨断点缩放窗口时，同步侧栏状态，避免桌面/移动布局错位
      const desktopMedia = window.matchMedia('(min-width: 900px)');
      const onBreakpointChange = () => {
        if (!desktopMedia.matches) {
          elements.app.classList.remove('sidebar-open');
          elements.tocButton.setAttribute('aria-expanded', 'false');
          elements.tocButton.setAttribute('aria-label', '返回目录');
        } else if (state.view === 'list') {
          setSidebar(true);
        }
        // 桌面/移动布局切换后，按新断点重算单元格字号
        fitTableCells(elements.articleContent);
      };
      if (desktopMedia.addEventListener) {
        desktopMedia.addEventListener('change', onBreakpointChange);
      } else if (desktopMedia.addListener) {
        desktopMedia.addListener(onBreakpointChange);
      }

      init();
    })();
  </script>
</body>
</html>
